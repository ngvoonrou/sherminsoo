<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film Gallery</title>
    <link
      rel="icon"
      href="assets/favicon/usagi-removebg.png"
      type="image/png"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/gallery.css" />
  </head>

  <body>
    <!-- HERO / HEADER -->
    <header class="gallery-hero" aria-label="Country cover">
      <a class="hero-back" href="index.html" aria-label="Back to home"
        ><span></span>Back</a
      >
      <div class="hero-overlay"></div>
      <div class="hero-inner container">
        <h1 id="heroTitle" class="hero-title">Film Gallery</h1>
        <p id="heroDesc" class="hero-desc text-white-50 mb-0"></p>

        <button
          class="hero-scroll"
          aria-label="Scroll to gallery"
          data-scroll="#masonry"
        >
          <span class="chev"></span>
        </button>
      </div>
    </header>

    <main class="container my-5">
      <!-- Masonry grid -->
      <section
        id="masonry"
        class="masonry"
        aria-live="polite"
        aria-busy="true"
      ></section>
    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="lb" aria-hidden="true">
      <button class="lb__close" aria-label="Close (Esc)">×</button>
      <button class="lb__nav lb__prev" aria-label="Previous image">‹</button>
      <figure class="lb__stage">
        <img id="lbImg" alt="" />
        <figcaption id="lbCap"></figcaption>
      </figure>
      <button class="lb__nav lb__next" aria-label="Next image">›</button>
    </div>

    <script type="module" src="js/gallery.js"></script>
  </body>
</html>
