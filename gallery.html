<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Film Gallery</title>
    <link
      rel="icon"
      href="assets/favicon/usagi-removebg.png"
      type="image/png"
    />

    <!-- Bootstrap (optional) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Site CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container my-5">
      <div class="gallery-head">
        <h2 id="galleryTitle">Film Gallery</h2>
        <p id="galleryDesc"></p>
      </div>

      <!-- Layout switcher -->
      <section class="gallery-controls" aria-label="Gallery display options">
        <div class="gc-inner">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <label for="layoutSelect" class="fw-semibold">Display</label>
            <select
              id="layoutSelect"
              class="form-select form-select-sm"
              aria-label="Choose gallery layout"
            >
              <option value="horizontal">Horizontal Scroll</option>
              <option value="slideshow">Slideshow</option>
            </select>
          </div>

          <div class="gc-help">
            <span class="gc-tip" id="layoutTip">
              Horizontal: scroll sideways with snap.
            </span>
          </div>
        </div>
      </section>

      <!-- Horizontal host -->
      <div
        id="galleryHost"
        class="gallery-host gallery--horizontal"
        aria-live="polite"
        aria-busy="true"
      ></div>

      <!-- Slideshow host (hidden unless slideshow mode) -->
      <section id="slideshowHost" class="slideshow-host" hidden>
        <div class="slideshow-frame">
          <button class="ss-btn ss-prev" aria-label="Previous image">‹</button>

          <figure class="ss-stage">
            <img class="ss-img" alt="" />
            <figcaption class="ss-cap"></figcaption>
          </figure>

          <button class="ss-btn ss-next" aria-label="Next image">›</button>
        </div>

        <div class="ss-thumbs" id="ssThumbs" aria-label="Thumbnails"></div>
      </section>
    </main>

    <script type="module" src="js/gallery.js"></script>
  </body>
</html>
